<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipment Task Hub</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e3e6ea;--ac:#2557d6;--tech:#d9822b;--own:#2557d6;--proj:#2e9e6b;--bad:#c93c3c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171c;--card:#1d2128;--tx:#e8eaed;--mut:#9aa3af;--bd:#2d333b;--ac:#6b93f5;--tech:#e8a05a;--own:#6b93f5;--proj:#52c394;--bad:#ef6b6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171c;--card:#1d2128;--tx:#e8eaed;--mut:#9aa3af;--bd:#2d333b;--ac:#6b93f5;--tech:#e8a05a;--own:#6b93f5;--proj:#52c394;--bad:#ef6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}.sub{color:var(--mut);font-size:13px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bd);margin:6px 0 4px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
button{width:auto;cursor:pointer;background:var(--card)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters>*{flex:1 1 130px}
.task{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;border-left:4px solid var(--bd)}
.task.Technician{border-left-color:var(--tech)}.task.Owner{border-left-color:var(--own)}.task.Project{border-left-color:var(--proj)}
.task.done{opacity:.55}.task.done .t{text-decoration:line-through}
.t{font-weight:600}.meta{font-size:12px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.od{color:var(--bad);font-weight:600}
.tag{border:1px solid var(--bd);border-radius:20px;padding:0 8px;font-size:11px}
.actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.actions select,.actions button{padding:3px 7px;font-size:12px;width:auto}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:13px;overflow-x:auto}
.hide{display:none}
</style></head>
<body><div class="wrap">
<header><div><h1>Equipment Task Hub</h1><div class="sub">One place for every tool issue, PM and improvement project</div></div>
<div style="display:flex;gap:6px"><button onclick="toggle('form')" class="pri">+ New task</button><button onclick="digest()">Digest</button></div></header>

<div class="stats">
<div class="card stat"><b id="sOpen">0</b><span>Open</span></div>
<div class="card stat"><b id="sOver" style="color:var(--bad)">0</b><span>Overdue</span></div>
<div class="card stat"><b id="sBlk">0</b><span>Blocked</span></div>
<div class="card stat"><b id="sWeek">0</b><span>Due in 7 days</span></div>
</div>
<div class="card" style="margin-bottom:10px"><div class="sub">Where open work sits</div><div class="bar" id="bar"></div>
<div class="legend"><span><i class="dot" style="background:var(--tech)"></i>Technician <b id="cT">0</b></span><span><i class="dot" style="background:var(--own)"></i>Owner <b id="cO">0</b></span><span><i class="dot" style="background:var(--proj)"></i>Improvement project <b id="cP">0</b></span></div></div>

<div class="card hide" id="form">
<div class="grid">
<div style="grid-column:1/-1"><label>Task</label><input id="fTitle" placeholder="e.g. Etcher 03 chamber leak check"></div>
<div><label>Equipment / tool</label><input id="fTool" placeholder="Etcher 03"></div>
<div><label>Assigned to</label><input id="fOwner" placeholder="Engineer name"></div>
<div><label>Tier</label><select id="fTier"><option>Technician</option><option>Owner</option><option>Project</option></select></div>
<div><label>Priority</label><select id="fPri"><option value="1">High</option><option value="2" selected>Medium</option><option value="3">Low</option></select></div>
<div><label>Due date</label><input id="fDue" type="date"></div>
<div><label>Repeats</label><select id="fRec"><option value="0">No</option><option value="7">Weekly</option><option value="14">Every 2 weeks</option><option value="30">Monthly</option><option value="90">Quarterly</option></select></div>
<div style="grid-column:1/-1"><label>Notes</label><textarea id="fNotes" rows="2"></textarea></div>
</div>
<button class="pri" onclick="addTask()">Add task</button></div>

<div class="card hide" id="dig"><b>Weekly digest</b><pre id="digTxt"></pre><button onclick="copyDig()">Copy</button></div>

<div class="filters">
<input id="q" placeholder="Search task or tool" oninput="render()">
<select id="fltOwner" onchange="render()"></select>
<select id="fltTier" onchange="render()"><option value="">All tiers</option><option>Technician</option><option>Owner</option><option>Project</option></select>
<select id="fltSt" onchange="render()"><option value="active">Active</option><option value="">All</option><option>Open</option><option>In progress</option><option>Blocked</option><option>Done</option></select>
</div>
<div id="list"></div>
</div>
<script>
const KEY='equip-task-hub-v1';
const iso=d=>d.toISOString().slice(0,10);
const today=()=>iso(new Date());
const plus=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tasks=[];
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
function seed(){const t=today();return[
{id:1,title:'Chamber leak-rate check',tool:'Etcher 03',tier:'Technician',pri:1,due:plus(t,-1),owner:'Alex',status:'Open',rec:7,notes:''},
{id:2,title:'Approve new PM interval for chiller',tool:'Chiller 01',tier:'Owner',pri:2,due:plus(t,3),owner:'Sam',status:'In progress',rec:0,notes:''},
{id:3,title:'Cut changeover time on CVD tools',tool:'CVD fleet',tier:'Project',pri:2,due:plus(t,21),owner:'Alex',status:'Open',rec:0,notes:'Target 20% reduction'},
{id:4,title:'Waiting on vendor for RF generator',tool:'Etcher 02',tier:'Owner',pri:1,due:plus(t,2),owner:'Sam',status:'Blocked',rec:0,notes:'PO raised'}]}
function toggle(id){$(id).classList.toggle('hide')}
function addTask(){const title=$('fTitle').value.trim();if(!title){$('fTitle').focus();return}
tasks.push({id:Date.now(),title,tool:$('fTool').value.trim(),tier:$('fTier').value,pri:+$('fPri').value,due:$('fDue').value,owner:$('fOwner').value.trim()||'Unassigned',status:'Open',rec:+$('fRec').value,notes:$('fNotes').value.trim()});
['fTitle','fTool','fOwner','fDue','fNotes'].forEach(i=>$(i).value='');save();render()}
function setStatus(id,st){const t=tasks.find(x=>x.id===id);if(!t)return;
if(st==='Done'&&t.status!=='Done'&&t.rec){tasks.push({...t,id:Date.now(),status:'Open',due:plus(t.due&&t.due>today()?t.due:today(),t.rec)})}
t.status=st;save();render()}
function del(id){tasks=tasks.filter(x=>x.id!==id);save();render()}
function isOver(t){return t.status!=='Done'&&t.due&&t.due<today()}
function render(){
const open=tasks.filter(t=>t.status!=='Done'),t0=today(),wk=plus(t0,7);
$('sOpen').textContent=open.length;$('sOver').textContent=open.filter(isOver).length;
$('sBlk').textContent=open.filter(t=>t.status==='Blocked').length;
$('sWeek').textContent=open.filter(t=>t.due&&t.due>=t0&&t.due<=wk).length;
const c={Technician:0,Owner:0,Project:0};open.forEach(t=>c[t.tier]++);
$('cT').textContent=c.Technician;$('cO').textContent=c.Owner;$('cP').textContent=c.Project;
const tot=open.length||1;
$('bar').innerHTML=['Technician:tech','Owner:own','Project:proj'].map(s=>{const[k,v]=s.split(':');return`<div style="width:${c[k]/tot*100}%;background:var(--${v})"></div>`}).join('');
const owners=[...new Set(tasks.map(t=>t.owner))].sort(),cur=$('fltOwner').value;
$('fltOwner').innerHTML='<option value="">Everyone</option>'+owners.map(o=>`<option${o===cur?' selected':''}>${esc(o)}</option>`).join('');
const q=$('q').value.toLowerCase(),fo=$('fltOwner').value,ft=$('fltTier').value,fs=$('fltSt').value;
const list=tasks.filter(t=>(!q||(t.title+' '+t.tool).toLowerCase().includes(q))&&(!fo||t.owner===fo)&&(!ft||t.tier===ft)&&(fs==='active'?t.status!=='Done':!fs||t.status===fs))
.sort((a,b)=>(a.status==='Done')-(b.status==='Done')||(a.due||'9')<(b.due||'9')?-1:1);
$('list').innerHTML=list.map(t=>`<div class="card task ${t.tier} ${t.status==='Done'?'done':''}"><div style="flex:1;min-width:0">
<div class="t">${esc(t.title)}</div>
<div class="meta"><span class="tag">${t.tier}</span>${t.tool?`<span>🔧 ${esc(t.tool)}</span>`:''}<span>👤 ${esc(t.owner)}</span>
<span>${['','High','Medium','Low'][t.pri]} priority</span>${t.due?`<span class="${isOver(t)?'od':''}">${isOver(t)?'Overdue · ':'Due '}${t.due}</span>`:''}${t.rec?`<span>↻ every ${t.rec}d</span>`:''}</div>
${t.notes?`<div class="sub">${esc(t.notes)}</div>`:''}
<div class="actions"><select onchange="setStatus(${t.id},this.value)">${['Open','In progress','Blocked','Done'].map(s=>`<option${s===t.status?' selected':''}>${s}</option>`).join('')}</select><button onclick="del(${t.id})">Delete</button></div>
</div></div>`).join('')||'<div class="sub">No tasks match.</div>'}
function digest(){const t0=today(),wk=plus(t0,7),by={};
tasks.filter(t=>t.status!=='Done').forEach(t=>(by[t.owner]=by[t.owner]||[]).push(t));
let s='Weekly digest — '+t0+'\n';
Object.keys(by).sort().forEach(o=>{const a=by[o];s+='\n'+o+' ('+a.length+' open)\n';
const f=(l,x)=>{if(x.length)s+='  '+l+':\n'+x.map(t=>'   - '+t.title+(t.tool?' ['+t.tool+']':'')+(t.due?' (due '+t.due+')':'')).join('\n')+'\n'};
f('Overdue',a.filter(isOver));f('Blocked',a.filter(t=>t.status==='Blocked'));
f('Due this week',a.filter(t=>t.due>=t0&&t.due<=wk&&t.status!=='Blocked'))});
$('digTxt').textContent=s;$('dig').classList.remove('hide')}
function copyDig(){try{navigator.clipboard.writeText($('digTxt').textContent)}catch(e){}}
tasks=load()||seed();render();
</script></body></html>
